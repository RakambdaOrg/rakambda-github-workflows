name: Gradle build

on:
  workflow_call:
    inputs:
      java-version:
        description: "JDK version to use"
        required: true
        type: string
      java-distribution:
        description: "JDK distribution to use"
        required: false
        type: string
        default: "temurin"
      artifact-name:
        description: "Name of artifact to get"
        required: false
        type: string
        default: ""
      artifact-archive:
        description: "Whether to compress the artifact"
        required: false
        type: boolean
        default: false
      artifact-path:
        description: "Path of the artifacts to get"
        required: false
        type: string
        default: "build/libs/*.jar"
      runs-on:
        description: "Runner to use"
        required: false
        type: string
        default: "ubuntu-latest"

permissions:
  contents: write

jobs:
  build:
    name: Gradle - Build
    runs-on: [ "${{ inputs.runs-on }}" ]
    concurrency:
      group: gradle-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Build project
        run: |
          ./gradlew \
          build

      - name: Upload artifacts
        id: gradle-build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: "${{ inputs.artifact-name != '' }}"
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          retention-days: 7
          if-no-files-found: warn
          archive: ${{ inputs.artifact-archive }}
