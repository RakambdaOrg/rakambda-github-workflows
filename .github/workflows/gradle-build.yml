name: Gradle build

on:
  workflow_call:
    inputs:
      java-version:
        description: "JDK version to use"
        required: true
        type: string
      java-distribution:
        description: "JDK distribution to use"
        required: false
        type: string
        default: "zulu"
      artifact-name:
        description: "Name of artifact to get"
        required: false
        type: string
        default: ""
      artifact-archive:
        description: "Whether to compress the artifact"
        required: false
        type: boolean
        default: false
      artifact-path:
        description: "Path of the artifacts to get"
        required: false
        type: string
        default: "build/libs/*.jar"
      runs-on:
        description: "Runner to use"
        required: false
        type: string
        default: "ubuntu-latest"
      extra-artifact-name:
        description: "Name of a second artifact to upload"
        required: false
        type: string
        default: ""
      extra-artifact-path:
        description: "Path of the second artifact"
        required: false
        type: string
        default: ""
      gradle-tasks:
        description: "Gradle tasks to run"
        required: false
        type: string
        default: "build"
      pre-script:
        description: "Shell commands run before Gradle (trusted caller input)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Gradle - Build
    runs-on: [ "${{ inputs.runs-on }}" ]
    concurrency:
      group: gradle-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Pre-build script
        if: ${{ inputs.pre-script != '' }}
        env:
          PRE_SCRIPT: ${{ inputs.pre-script }}
        run: bash -e -c "$PRE_SCRIPT"

      - name: Build project
        env:
          GRADLE_TASKS: ${{ inputs.gradle-tasks }}
        run: ./gradlew $GRADLE_TASKS

      - name: Upload artifacts
        id: gradle-build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: "${{ inputs.artifact-name != '' }}"
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          retention-days: 7
          if-no-files-found: warn
          archive: ${{ inputs.artifact-archive }}

      - name: Upload extra artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: "${{ inputs.extra-artifact-name != '' }}"
        with:
          name: ${{ inputs.extra-artifact-name }}
          path: ${{ inputs.extra-artifact-path }}
          retention-days: 7
          if-no-files-found: warn
          archive: ${{ inputs.artifact-archive }}
