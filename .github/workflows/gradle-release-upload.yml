name: Gradle release upload

# For a release that already exists: builds the tag and uploads files to it.
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag of the release to build and upload to"
        required: true
        type: string
      java-version:
        description: "JDK version to use"
        required: true
        type: string
      java-distribution:
        description: "JDK distribution to use"
        required: false
        type: string
        default: "zulu"
      pre-script:
        description: "Shell commands run before Gradle, with RELEASE_TAG set (trusted caller input)"
        required: false
        type: string
        default: ""
      gradle-tasks:
        description: "Gradle tasks producing the files to upload"
        required: false
        type: string
        default: "build"
      upload-glob:
        description: "Glob of the files to upload to the release"
        required: true
        type: string
      runs-on:
        description: "Runner to use"
        required: false
        type: string
        default: "ubuntu-latest"

permissions:
  contents: write

jobs:
  upload:
    name: Gradle - Release upload
    runs-on: [ "${{ inputs.runs-on }}" ]
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: Pre-build script
        if: ${{ inputs.pre-script != '' }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PRE_SCRIPT: ${{ inputs.pre-script }}
        run: bash -e -c "$PRE_SCRIPT"
      - name: Build project
        env:
          GRADLE_TASKS: ${{ inputs.gradle-tasks }}
        run: ./gradlew $GRADLE_TASKS
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          UPLOAD_GLOB: ${{ inputs.upload-glob }}
        run: gh release upload "$RELEASE_TAG" $UPLOAD_GLOB --clobber
