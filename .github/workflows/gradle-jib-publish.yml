name: Gradle Docker publish

on:
  workflow_call:
    inputs:
      java-version:
        description: "JDK version to use"
        required: true
        type: string
      java-distribution:
        description: "JDK distribution to use"
        required: false
        type: string
        default: "zulu"
      docker-image:
        description: "Name of the docker image to push"
        required: true
        type: string
      docker-tag:
        description: "Tag of the docker image to push, defaults to current branch name"
        required: false
        type: string
        default: ""
      build-base-image:
        description: "Build the repository's Dockerfile (amd64 only, build arg JAVA_VERSION=java-version), push it as <docker-image>:base and use it as the Jib base image"
        required: false
        type: boolean
        default: false
      runs-on:
        description: "Runner to use"
        required: false
        type: string
        default: "ubuntu-latest"
      environment:
        description: "Environment to use"
        required: false
        type: string
    secrets:
      jib-extra-params:
        description: "Extra jib parameters"
        required: false
      docker-repo:
        description: "Docker registry to push to"
        required: true
      docker-username:
        description: "Docker username"
        required: true
      docker-token:
        description: "Docker token"
        required: true

jobs:
  publish:
    name: Gradle - Publish Docker
    runs-on: [ "${{ inputs.runs-on }}" ]
    environment: ${{ inputs.environment }}
    concurrency: 
      group: docker-publish-${{ inputs.docker-tag }}
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        if: ${{ inputs.build-base-image }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login on registry
        if: ${{ inputs.build-base-image }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ secrets.docker-repo }}
          username: ${{ secrets.docker-username }}
          password: ${{ secrets.docker-token }}
      - name: Build and push base image
        if: ${{ inputs.build-base-image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ secrets.docker-repo }}/${{ inputs.docker-image }}:base
          platforms: linux/amd64
          build-args: JAVA_VERSION=${{ inputs.java-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Calculate image tag
        id: image-tag
        run: |
          if [ -z "${{ inputs.docker-tag }}" ]; then
            echo "tag=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.docker-tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean extra params
        id: extra-params
        run: |
          EXTRA_PARAMS=$(printf "%s" "${{ secrets.jib-extra-params }}")
          echo "extra-params=$EXTRA_PARAMS" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Jib
        run: |
          ./gradlew \
          jib ${{ steps.extra-params.outputs.extra-params }} \
          ${{ inputs.build-base-image && format('-Djib.from.image={0}/{1}:base -Djib.from.auth.username={2} -Djib.from.auth.password={3}', secrets.docker-repo, inputs.docker-image, secrets.docker-username, secrets.docker-token) || '' }} \
          -Djib.to.auth.username=${{ secrets.docker-username }} \
          -Djib.to.auth.password=${{ secrets.docker-token }} \
          -Djib.to.image=${{ secrets.docker-repo }}/${{ inputs.docker-image }}:${{ steps.image-tag.outputs.tag }} \
          -Djib.console=plain