name: Gradle module tests

on:
  workflow_call:
    inputs:
      module:
        description: "Gradle module (directory name) to test, e.g. miner"
        required: true
        type: string
      java-version:
        description: "JDK version to use"
        required: true
        type: string
      java-distribution:
        description: "JDK distribution to use"
        required: false
        type: string
        default: "zulu"
      runs-on:
        description: "Runner to use"
        required: false
        type: string
        default: "ubuntu-latest"
      send-codecov:
        description: "Whether to send the JaCoCo report on Codecov"
        required: false
        type: boolean
        default: false
    secrets:
      codecov-token:
        description: "Token to upload reports on Codecov"
        required: false

permissions:
  contents: read
  checks: write

jobs:
  tests:
    name: Gradle - Tests ${{ inputs.module }}
    runs-on: [ "${{ inputs.runs-on }}" ]
    concurrency:
      group: gradle-test-${{ inputs.module }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Run tests
        run: ./gradlew :${{ inputs.module }}:test --scan

      - name: Generate JaCoCo report
        if: always()
        run: ./gradlew :${{ inputs.module }}:jacocoTestReport

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: always()
        with:
          report_paths: '${{ inputs.module }}/build/test-results/test/*.xml'

      - name: Publish coverage on CodeCov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ always() && inputs.send-codecov }}
        with:
          token: ${{ secrets.codecov-token }}
          files: ${{ inputs.module }}/build/reports/jacoco/test/jacocoTestReport.xml
          flags: unittests-${{ inputs.module }}
          name: codecov-github-actions

      - name: Upload JUnit reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-test-results-${{ inputs.module }}
          path: |
            ${{ inputs.module }}/build/test-results/test/*.xml
            ${{ inputs.module }}/build/reports/tests/tests
          if-no-files-found: error
          retention-days: 14
      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: jacoco-test-results-${{ inputs.module }}
          path: |
            ${{ inputs.module }}/build/reports/jacoco/test/*.xml
            ${{ inputs.module }}/build/reports/jacoco
          if-no-files-found: error
          retention-days: 14
