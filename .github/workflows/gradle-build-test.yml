name: Gradle build & test

on:
  workflow_call:
    inputs:
      java-version:
        description: "JDK version to use"
        required: true
        type: string
      java-distribution:
        description: "JDK distribution to use"
        required: false
        type: string
        default: "temurin"
      artifact-name:
        description: "Name of artifact to get"
        required: false
        type: string
        default: ""
      artifact-archive:
        description: "Whether to compress the artifact"
        required: false
        type: boolean
        default: false
      artifact-path:
        description: "Path of the artifacts to get"
        required: false
        type: string
        default: "build/libs/*.jar"
      runs-on:
        description: "Runner to use"
        required: false
        type: string
        default: "ubuntu-latest"
      generate-jacoco:
        description: "Whether to generate JaCoCo report"
        required: false
        type: boolean
        default: false
      send-codecov:
        description: "Whether to send coverage report on Codecov"
        required: false
        type: boolean
        default: false
      environment:
        description: "Environment to use"
        required: false
        type: string
    secrets:
      codecov-token:
        description: "Token to upload reports on Codecov"
        required: false

permissions:
  contents: write
  checks: write

jobs:
  build:
    name: Gradle - Build
    runs-on: [ "${{ inputs.runs-on }}" ]
    environment: ${{ inputs.environment }}
    concurrency:
      group: gradle-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Build project
        run: |
          ./gradlew \
          assemble \
          --scan

      - name: Upload artifacts
        id: gradle-build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: "${{ inputs.artifact-name != '' }}"
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          retention-days: 7
          if-no-files-found: warn
          archive: ${{ inputs.artifact-archive }}

  tests:
    name: Gradle - Tests
    runs-on: [ "${{ inputs.runs-on }}" ]
    environment: ${{ inputs.environment }}
    concurrency:
      group: gradle-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Build project
        run: |
          ./gradlew \
          test \
          --scan

      - name: Generate JaCoCo report
        if: ${{ inputs.generate-jacoco }}
        run: |
          ./gradlew \
          jacocoTestReport

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@4a26df3e2ae132254ba12a53f65a388d0961e786 # v6.7.0
        if: always()
        with:
          report_paths: 'build/test-results/test/*.xml'

      - name: Publish coverage on CodeCov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ inputs.generate-jacoco && inputs.send-codecov }}
        with:
          token: ${{ secrets.codecov-token }}
          files: build/test-results/test/*.xml
          flags: unittests
          name: codecov-github-actions
      # https://github.com/codecov/test-results-action/issues/72
      - name: Publish tests on CodeCov
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        if: ${{ !always() }} #${{ inputs.generate-jacoco && inputs.send-codecov }}
        with:
          token: ${{ secrets.codecov-token }}
          files: build/reports/jacoco/test/jacocoTestReport.xml
          flags: unittests
          name: codecov-github-actions

      - name: Upload JUnit reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-test-results
          path: |
            build/test-results/test/*.xml
            build/reports/tests/test
          if-no-files-found: error
          retention-days: 7
      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: jacoco-test-results
          path: |
            build/reports/jacoco/test/*.xml
            build/reports/jacoco
          if-no-files-found: error
          retention-days: 7

